[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-engine"
version = "0.1.0"
description = "Enterprise Python Automation Capstone: Automated Financial Data Fetching, Business Intelligence Analytics, and ReportLab PDF Report Generation"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Faizan Ali", email = "git.faizanali@gmail.com" }
]
dependencies = [
    "requests>=2.31.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
capstone-report = "capstone_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=capstone_engine --cov-report=term-missing"
